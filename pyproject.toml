[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spaceflight-gnn"
version = "1.0.0"
description = "Heterogeneous Graph Neural Network Drug Repurposing for Spaceflight-Induced Muscle Atrophy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Nikassh Bala", email = "nikassh@example.com"}
]
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "scikit-learn>=1.0.0",
    "requests>=2.28.0",
    "mygene>=3.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "flake8>=6.0.0"
]
